[project]
name = "mango-reach-agent"
version = "0.1.0"
description = "MangoAI — Sales Copilot Agent for Mango Reach"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "litellm>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mango_agent", "api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
